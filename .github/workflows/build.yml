name: Build GLAC Desktop App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-app:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Build Desktop Executable (.exe)
        run: npm run build

      - name: Upload Installer Executable
        uses: actions/upload-artifact@v3
        with:
          name: GLAC-Master-Control-Setup
          path: dist/*.exe
